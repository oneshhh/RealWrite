<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/realwrite-logo.png" />
    <link rel="apple-touch-icon" href="/assets/realwrite-logo.png" />
    <title>Real Write • Writer • Earnings</title>
    <link rel="stylesheet" href="/assets/styles.css?v=ui-20261006-writer-earnings-1" />
    <script src="/shared/config.js"></script>
    <script src="/shared/app.js"></script>
    <script src="/shared/topbar.js"></script>
  </head>
  <body>
    <div class="topbar" id="topbar"></div>
    <div class="wrap wide">
      <div class="grid">
        <div class="card">
          <h2 id="summaryMonthHeading">This Month</h2>
          <div class="row">
            <div class="stat">
              <div class="pill dot green">Paid</div>
              <div class="n" id="nPaidMonth">0</div>
            </div>
            <div class="stat">
              <div class="pill dot amber">Pending</div>
              <div class="n" id="nPendingMonth">0</div>
            </div>
            <div class="stat">
              <div class="pill dot blue">Payments</div>
              <div class="n" id="nApprovedTotal">0</div>
            </div>
          </div>
          <div class="muted" style="margin-top: 8px">Totals follow the month selected in payment history.</div>
        </div>

        <div class="card">
          <div class="writer-payment-history-head">
            <div>
              <h2>Payment History</h2>
              <p class="muted">Browse your own paid and pending payments month by month.</p>
            </div>
            <div class="writer-payment-month-filter" aria-label="Payment month filter">
              <button class="secondary writer-payment-month-arrow" id="prevMonth" type="button" aria-label="Previous month">←</button>
              <span class="pill writer-payment-month-label" id="monthLabel">This month</span>
              <button class="secondary writer-payment-month-arrow" id="nextMonth" type="button" aria-label="Next month">→</button>
              <button class="secondary" id="apply" type="button">Apply</button>
              <button class="secondary" id="clear" type="button">Reset</button>
            </div>
          </div>
          <table class="mobile-stack-table payment-history-table">
            <thead>
              <tr>
                <th>Article</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Created</th>
                <th>Paid at</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="right" style="margin-top: 12px">
            <button class="secondary" id="prev">Previous</button>
            <span class="muted" id="pageInfo"></span>
            <button class="secondary" id="next">Next</button>
          </div>
          <div class="muted" id="msg" style="margin-top: 10px"></div>
        </div>
      </div>
    </div>
    <script>
      (async function () {
        const user = await APP.requireRole("writer");
        if (!user) return;
        await renderTopbar({
          role: user.role,
          links: [
            { href: "/writer/dashboard.html", label: "Dashboard" },
            { href: "/writer/earnings.html", label: "Earnings" }
          ]
        });

        const msg = (t) => (document.getElementById("msg").textContent = t || "");

        APP.ui.textSkeleton("nPaidMonth", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("nPendingMonth", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("nApprovedTotal", { kind: "num", width: "54%" });
        APP.ui.textSkeleton("pageInfo", { kind: "line", width: "120px" });

        const pageSize = 20;
        let offset = 0;
        let total = null;
        let currentMonth = new Date();
        const requestedPaymentId = new URLSearchParams(window.location.search).get("payment");

        function setMonth(date) {
          currentMonth = new Date(date.getFullYear(), date.getMonth(), 1);
          const label = currentMonth.toLocaleString(undefined, { month: "long", year: "numeric" });
          document.getElementById("monthLabel").textContent = label;
          document.getElementById("summaryMonthHeading").textContent = label;
        }

        function buildQuery({ includePaging } = { includePaging: true }) {
          const query = new URLSearchParams();
          if (includePaging) {
            query.set("limit", String(pageSize));
            query.set("offset", String(offset));
          }
          const from = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1, 0, 0, 0, 0);
          const to = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1, 0, 0, 0, 0);
          query.set("from", from.toISOString());
          query.set("to", to.toISOString());
          return query;
        }

        async function refreshSummary() {
          const out = await APP.apiFetch(`/api/payments/stats?${buildQuery({ includePaging: false }).toString()}`);
          document.getElementById("nPaidMonth").textContent = `₹${Number(out.paid_amount || 0).toFixed(0)}`;
          document.getElementById("nPendingMonth").textContent = `₹${Number(out.pending_amount || 0).toFixed(0)}`;
          document.getElementById("nApprovedTotal").textContent = String(out.payments_count || 0);
        }

        function renderRows(rows) {
          if (!rows?.length) {
            document.getElementById("rows").innerHTML = `<tr><td colspan="5" class="muted writer-payment-empty">No payments found for ${APP.escapeHtml(document.getElementById("monthLabel").textContent)}.</td></tr>`;
            return;
          }
          document.getElementById("rows").innerHTML = (rows || [])
            .map((p) => {
              const a = p.articles;
              const title = a?.title || p.request_title || (p.article_id ? "Article" : "Request bonus");
              const uid = a?.unique_id || p.article_id || "Accepted writing request";
              const status = a?.status || (p.article_id ? "-" : "request");
              return `<tr data-payment-row="${p.id}">
                <td data-label="Article">
                  <div style="font-weight:750">${APP.escapeHtml(title)}</div>
                  <div class="muted">${APP.escapeHtml(uid)} • ${APP.escapeHtml(status)}</div>
                </td>
                <td>₹${APP.escapeHtml(Number(p.amount || 0).toFixed(0))}</td>
                <td>${
                  p.status === "paid"
                    ? "<span class='badge b-approved'>paid</span>"
                    : "<span class='badge b-submitted'>pending</span>"
                }</td>
                <td class="muted" data-label="Created">${APP.escapeHtml(new Date(p.created_at).toLocaleString())}</td>
                <td class="muted" data-label="Paid at">${p.paid_at ? APP.escapeHtml(new Date(p.paid_at).toLocaleString()) : "-"}</td>
              </tr>`;
            })
            .join("");
          if (requestedPaymentId) {
            const row = document.querySelector(`[data-payment-row="${requestedPaymentId}"]`);
            if (row) {
              row.style.outline = "2px solid rgba(196,90,43,0.45)";
              row.style.outlineOffset = "-2px";
              row.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          }
        }

        function updatePager() {
          const page = Math.floor(offset / pageSize) + 1;
          const pages = total == null ? null : Math.max(1, Math.ceil(total / pageSize));
          document.getElementById("prev").disabled = offset <= 0;
          document.getElementById("next").disabled = total != null ? offset + pageSize >= total : false;
          document.getElementById("pageInfo").textContent = pages ? `Page ${page} of ${pages}` : `Page ${page}`;
        }

        async function loadPage() {
          APP.ui.tableSkeleton("rows", { rows: 10, cols: 5 });
          const out = await APP.apiFetch(`/api/payments?${buildQuery({ includePaging: true }).toString()}`);
          total = out.total ?? 0;
          renderRows(out.payments || []);
          updatePager();
        }

        async function refreshAll() {
          msg("");
          await Promise.all([refreshSummary(), loadPage()]);
        }

        try {
          document.getElementById("prev").onclick = async () => {
            offset = Math.max(0, offset - pageSize);
            await loadPage();
          };
          document.getElementById("next").onclick = async () => {
            offset = offset + pageSize;
            await loadPage();
          };

          document.getElementById("apply").onclick = async () => {
            offset = 0;
            await refreshAll();
          };
          document.getElementById("clear").onclick = async () => {
            setMonth(new Date());
            offset = 0;
            await refreshAll();
          };
          document.getElementById("prevMonth").onclick = async () => {
            const date = new Date(currentMonth);
            date.setMonth(date.getMonth() - 1);
            setMonth(date);
            offset = 0;
            await refreshAll();
          };
          document.getElementById("nextMonth").onclick = async () => {
            const date = new Date(currentMonth);
            date.setMonth(date.getMonth() + 1);
            setMonth(date);
            offset = 0;
            await refreshAll();
          };

          setMonth(new Date());
          await refreshAll();
        } catch (e) {
          msg(e.message || String(e));
        }
      })();
    </script>
  </body>
</html>
